<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
  <meta name="theme-color" content="#ffffff" id="theme-color-meta"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="JaveCupos"/>
  <meta name="description" content="Carpooling universitario PUJ Cali"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <title>JaveCupos — PUJ Cali</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="css/style.css"/>

  <script>
    // Apply saved theme immediately to avoid flash
    (function() {
      const t = localStorage.getItem('jv-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.addEventListener('DOMContentLoaded', function() {
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = t === 'dark' ? '#0a0a0a' : '#ffffff';
      });
    })();
  </script>
</head>
<body>
  <div class="iphone-container">
    <div class="iphone-frame">
      <div class="btn-action"></div>
      <div class="btn-volume-up"></div>
      <div class="btn-volume-down"></div>
      <div class="btn-power"></div>
      <div class="bezel">
        <div class="dynamic-island-container"><div class="dynamic-island"></div></div>
        <div id="app">
    <div id="splash">
      <div class="splash-inner">
        <svg class="splash-logo-svg" viewBox="0 0 60 60" fill="none">
          <rect width="60" height="60" rx="14" fill="#000000"/>
          <path d="M16 20h28M16 30h20M16 40h24" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <p class="splash-name">JaveCupos</p>
        <p class="splash-sub">PUJ Cali · Carpooling</p>
      </div>
    </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-container"></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
